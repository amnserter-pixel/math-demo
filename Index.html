<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Try One Grade 8 Problem</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }
    .wrap {
      max-width: 760px;
      margin: 60px auto;
      padding: 40px 28px;
      background: #fff;
      box-sizing: border-box;
    }
    h1 {
      font-size: 30px;
      line-height: 1.3;
      margin: 0 0 16px;
      font-weight: 400;
      text-align: center;
    }
    p {
      font-size: 18px;
      line-height: 1.7;
      margin: 0 0 18px;
      text-align: center;
    }
    textarea {
      width: 100%;
      min-height: 140px;
      padding: 14px;
      font-size: 16px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
      margin-top: 18px;
    }
    .btn {
      display: inline-block;
      margin-top: 18px;
      padding: 16px 28px;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      border: none;
      background: #111;
      color: #fff;
    }
    #response {
      margin-top: 28px;
      padding: 22px;
      background: #fafafa;
      border: 1px solid #e3e3e3;
      border-radius: 6px;
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 16px;
      display: none;
    }
    #error {
      margin-top: 18px;
      color: #b00020;
      display: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Try One Grade 8 Problem</h1>
    <p>Paste one Grade 8 equation or early algebra problem and see how AI Math Coach helps step by step.</p>
    <p>No answer dumping. Just the next step.</p>

    <textarea id="question" placeholder="Example: Solve 3x + 5 = 20"></textarea>
    <button class="btn" id="tryBtn">Try It Now</button>

    <div id="error"></div>
    <div id="response"></div>

    <div id="trialCta" style="display:none; margin-top:18px; text-align:center;">
      <p style="font-size:16px; line-height:1.6; margin:0 0 14px;">
        If this helped, start the free 14-day trial. No credit card required.
      </p>
      <a href="https://joyful-dodol-702077.netlify.app/" style="display:inline-block;padding:16px 24px;background:#111;color:#fff;text-decoration:none;border-radius:6px;font-size:14px;letter-spacing:3px;text-transform:uppercase;font-weight:700;">
        Start Free 14-Day Trial
      </a>
    </div>
  </div>

<script>
  const tryBtn = document.getElementById("tryBtn");
  const questionEl = document.getElementById("question");
  const responseEl = document.getElementById("response");
  const errorEl = document.getElementById("error");
  const trialCtaEl = document.getElementById("trialCta");

  tryBtn.addEventListener("click", async () => {
    const question = questionEl.value.trim();

    errorEl.style.display = "none";
    responseEl.style.display = "none";
    trialCtaEl.style.display = "none";
    errorEl.textContent = "";

    if (!question) {
      errorEl.textContent = "Please paste one math problem first.";
      errorEl.style.display = "block";
      return;
    }

    tryBtn.disabled = true;
    tryBtn.textContent = "Thinking...";

    try {
      const res = await fetch("/.netlify/functions/demo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ problem: question })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.reply || data.error || "Something went wrong.");
      }

      responseEl.textContent = (data.reply || "")
        .replace(/\\\(|\\\)|\\\[|\\\]/g, "")
        .replace(/\*\*/g, "");

      responseEl.style.display = "block";
      trialCtaEl.style.display = "block";
    } catch (err) {
      errorEl.textContent = err.message || "Something went wrong.";
      errorEl.style.display = "block";
    } finally {
      tryBtn.disabled = false;
      tryBtn.textContent = "Try It Now";
    }
  });
</script>
</body>
</html>
